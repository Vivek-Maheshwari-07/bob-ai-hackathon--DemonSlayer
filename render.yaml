services:
  - type: web
    name: pharmsignals-backend
    runtime: docker
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # Set this to your deployed Vercel URL(s) once known, e.g.
      # https://pharmsignals.vercel.app — comma-separate multiple origins.
      - key: CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview-deploy URLs too (they change per push).
      - key: CORS_ORIGIN_REGEX
        sync: false
