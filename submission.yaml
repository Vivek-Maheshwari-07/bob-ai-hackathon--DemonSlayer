submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"
  problem_statement_id: "P2"
  problem_statement: >-
    Pharmacovigilance and regulatory teams face significant challenges in detecting emerging
    drug safety signals from voluminous adverse-event data and ensuring Common Technical Document
    (CTD) dossiers conform to ICH M4 completeness standards. Manual cross-referencing and fragmented
    workflows lead to delayed safety investigations and submission bottlenecks.
  solution_summary: >-
    A dual-capability intelligence platform combining pharmacovigilance adverse-event signal
    detection (real openFDA FAERS data ingestion, disproportionality scoring via Evans Proportional
    Reporting Ratio [PRR] and chi-square, and digital-twin walk-forward backtesting) with an automated
    ICH M4 CTD dossier readiness checker (readiness percentage, module-wise scoring, critical gap reporting),
    augmented by an interactive IBM Bob AI Copilot for explainable natural-language inquiries.
  key_features:
    - "Real openFDA FAERS adverse event data ingestion, cleaning, and normalization across benchmark drugs (VIOXX, BAYCOL, AVANDIA)"
    - "PRR (Proportional Reporting Ratio) and Pearson chi-square disproportionality signal detection with standard regulatory thresholds"
    - "Digital-twin time-series PRR trajectory projection and historical regulatory action walk-forward backtesting"
    - "ICH M4-aligned CTD dossier structural inspection and section completeness verification"
    - "Overall submission-readiness percentage and module-wise readiness scoring (Modules 1-5)"
    - "Critical missing document/section identification and gap report generation"
    - "IBM Bob AI Copilot for natural-language safety signal and regulatory readiness investigation"
  status: "Completed end-to-end M1-M5 pipeline with real openFDA FAERS data, interactive PRR analytics, ICH M4 readiness RAG, and IBM Bob AI Copilot"
