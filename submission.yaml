submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"
  problem_statement_id: "P2"
  problem_statement: >-
    FDA's FAERS database has 20M+ adverse event reports. Vioxx caused 27,000+ heart
    attacks before its signal was acted on. Separately, a drug approval CTD dossier spans
    100,000+ pages across 5 modules — one missing section gets it rejected, costing 6–12
    months and $50–100M. Both problems share the same root cause: too much complex
    data for manual review.
  solution_summary: >-
    PharmSignals is a dual-mode clinical intelligence and regulatory platform built with IBM Bob:
    (1) Signal Detection — ingests openFDA FAERS adverse event reports, clusters events across
    clinical features, and calculates Evans PRR statistics and Chi-square to flag emerging safety signals
    with walk-forward longitudinal backtesting; (2) Submission Readiness — checks dossier outlines
    against ICH M4 CTD requirements (Modules 1–5), scores completeness per module, and generates
    prioritized gap reports, supported by an interactive IBM Bob Copilot.
  key_features:
    - "openFDA FAERS adverse event ingestion and normalization across post-marketing surveillance datasets"
    - "Evans PRR (Proportional Reporting Ratio) and Pearson Chi-square disproportionality signal detection"
    - "Multi-dimensional adverse event clustering across 7 clinical/demographic features with 2D PCA projection"
    - "Walk-forward longitudinal PRR trajectory backtesting demonstrating early signal detection (+242 days on Vioxx)"
    - "ICH M4 CTD compliance engine scoring dossier completeness across Modules 1 through 5"
    - "Priority Regulatory Gap Matrix classifying omissions by severity (CRITICAL, MAJOR, STANDARD) with citations"
    - "IBM Bob Copilot with live domain context injection and deterministic offline rule-based fallback"
  repository_url: "https://github.com/Vivek-Maheshwari-07/bob-ai-hackathon--DemonSlayer"
  demo_video_url: "https://youtu.be/7POfIsw83OA"
  live_demo_url: "NOT DEPLOYED"
